[project]
name = "asf-console"
version = "0.1.0"
description = "Agentic Software Factory Console: OTLP receiver and TUI"
requires-python = ">=3.12"
dependencies = ["textual>=0.80"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asf_console"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

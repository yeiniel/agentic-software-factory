[project]
name = "factory"
version = "0.1.0"
description = "Agentic Software Factory core"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "asf-adapters",
    "asf-console",
    "coverage==7.16.2",
    "hypothesis==6.170.5",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-timeout==2.4.0",
    "ruff==0.17.1",
    "vulture==2.16",
]
mutate = ["cosmic-ray==8.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.uv.workspace]
members = ["console", "adapters"]

[tool.uv.sources]
asf-adapters = { workspace = true }
asf-console = { workspace = true }

[tool.pytest]
strict = true
testpaths = ["tests", "console/tests"]
addopts = ["-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
timeout = "300"

[tool.coverage.run]
branch = true
data_file = ".cov/coverage"
patch = ["subprocess"]
sigterm = true
relative_files = true
source_pkgs = ["factory", "asf_console", "asf_adapters"]
source_dirs = ["adapters"]
disable_warnings = ["no-data-collected", "module-not-imported"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 120
extend-include = ["adapters/*"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "CPY001", "D203", "D213",  # formatter conflict, copyright header, docstring style pairs
    "D1",  # missing docstrings: names and scenarios carry the meaning, comments only say why
    "D401",  # docstrings are noun phrases
    "EM101", "EM102", "TRY003",  # exception messages are written where they are raised
    "PLR0913", "PLR0917",  # the core threads a Task's context explicitly; reshaping it is not this work
    "S310", "S603", "S607", "T201",  # the products run configured commands, open the operator's URLs and print for their callers
]

[tool.ruff.lint.per-file-ignores]
# Tests are scenarios: asserts, subprocesses, fixtures and helpers without annotations.
"{tests,console/tests}/**" = ["ANN", "ARG", "S101", "S603", "S607", "S310", "PLR2004", "PLR0913", "PLR0917",
                              "PT018", "PLW1510", "INP001", "T201", "FBT", "E741", "PTH", "SIM", "BLE001",
                              "S108", "S104", "S602", "PLC0415", "E402", "I001", "S110", "S311", "C901"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src", "console/asf_console", "adapters"]
include = [
    "src", "console", "adapters", "tests",
    "adapters/event-source", "adapters/records", "adapters/records-otlp",
    "adapters/repo-host", "adapters/runner", "adapters/task-store",
]
exclude = ["**/.venv", "**/__pycache__"]
venvPath = "."
venv = ".venv"
